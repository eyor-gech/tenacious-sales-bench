[project]
name = "tenacious-sales-bench"
version = "0.1.0"
description = "Week 11 Interim – Tenacious B2B Sales Benchmark (TenaciousBench-v0.1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.4.0",
    "sentence-transformers>=2.7.0",
    "datasets>=2.19.0",
    "jsonschema>=4.22.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
train = [
    "trl>=0.8.6",
    "transformers>=4.40.0",
    "accelerate>=0.29.0",
    "bitsandbytes>=0.43.0",
    "peft>=0.10.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generation_scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

# ── UV virtual environment ──────────────────────────────────────────────────
# Run:  uv venv && uv pip install -e ".[dev]"
# For training dependencies:  uv pip install -e ".[train,dev]"
